semantic_models:
  - name: users
    description: Customer attributes. traffic_source is the acquisition channel.
    model: ref('dim_users')
    entities:
      - name: user
        type: primary
        expr: user_id
    dimensions:
      - name: country
        type: categorical
      - name: traffic_source
        type: categorical
      - name: gender
        type: categorical

  - name: products
    description: Product attributes.
    model: ref('dim_products')
    entities:
      - name: product
        type: primary
        expr: product_id
    dimensions:
      - name: category
        type: categorical
      - name: brand
        type: categorical
      - name: department
        type: categorical
      - name: distribution_center
        type: categorical
