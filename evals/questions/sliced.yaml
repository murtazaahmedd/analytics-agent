# In-scope, sliced or filtered. Key columns first, value last; ordered=true compares row order too.
- id: x01
  question: AOV by country, last quarter, top 5
  expect: answered
  ordered: true
  sql: |
    with u as (select id, country from thelook_ecommerce.users),
    items as (
      select u.country,
             sum(case when i.status != 'Cancelled' then i.sale_price else 0 end)
           - sum(case when i.status = 'Returned' then i.sale_price else 0 end) as net
      from thelook_ecommerce.order_items i join u on i.user_id = u.id
      where cast(i.created_at as date) between '2026-07-01' and '2026-09-30' group by 1),
    orders as (
      select u.country, count(*) as n
      from thelook_ecommerce.orders o join u on o.user_id = u.id
      where o.status != 'Cancelled' and cast(o.created_at as date) between '2026-07-01' and '2026-09-30' group by 1)
    select items.country, net / n as aov from items join orders using (country) order by aov desc limit 5
- id: x02
  question: Gross revenue by category in 2025
  expect: answered
  sql: |
    select p.category, sum(i.sale_price)
    from thelook_ecommerce.order_items i join thelook_ecommerce.products p on i.product_id = p.id
    where i.status != 'Cancelled' and cast(i.created_at as date) between '2025-01-01' and '2025-12-31'
    group by 1
- id: x03
  question: Orders by status last month
  expect: answered
  sql: |
    select status, count(*) from thelook_ecommerce.orders
    where cast(created_at as date) between '2026-10-01' and '2026-10-31' group by 1
- id: x04
  question: Return rate by brand in 2025
  expect: answered
  sql: |
    select p.brand, sum(case when i.status = 'Returned' then 1 else 0 end) * 1.0
                  / sum(case when i.delivered_at is not null then 1 else 0 end)
    from thelook_ecommerce.order_items i join thelook_ecommerce.products p on i.product_id = p.id
    where cast(i.created_at as date) between '2025-01-01' and '2025-12-31' group by 1
- id: x05
  question: Sessions by traffic source last month
  expect: answered
  sql: |
    with s as (select session_id, min(created_at) as start_at, any_value(traffic_source) as src
               from thelook_ecommerce.events group by 1)
    select src, count(*) from s where cast(start_at as date) between '2026-10-01' and '2026-10-31' group by 1
- id: x06
  question: Checkout conversion by browser last week
  expect: answered
  sql: |
    with s as (
      select session_id, min(created_at) as start_at, any_value(browser) as browser,
             max(case when event_type = 'cart' then 1 else 0 end) as cart,
             max(case when event_type = 'purchase' then 1 else 0 end) as buy
      from thelook_ecommerce.events group by 1)
    select browser, sum(cart * buy) * 1.0 / sum(cart) from s
    where cast(start_at as date) between '2026-10-19' and '2026-10-25' group by 1
- id: x07
  question: Fulfilment time by distribution center in September 2026
  expect: answered
  sql: |
    select dc.name, median(date_diff('second', i.created_at, i.shipped_at) / 3600.0)
    from thelook_ecommerce.order_items i
    join thelook_ecommerce.products p on i.product_id = p.id
    join thelook_ecommerce.distribution_centers dc on p.distribution_center_id = dc.id
    where i.shipped_at is not null and cast(i.created_at as date) between '2026-09-01' and '2026-09-30'
    group by 1
- id: x08
  question: Net revenue by month in Q1 2026
  expect: answered
  sql: |
    select date_trunc('month', created_at),
           sum(case when status != 'Cancelled' then sale_price else 0 end)
         - sum(case when status = 'Returned' then sale_price else 0 end)
    from thelook_ecommerce.order_items
    where cast(created_at as date) between '2026-01-01' and '2026-03-31' group by 1
- id: x09
  question: Which category had the highest gross margin in 2025?
  expect: answered
  ordered: true
  sql: |
    select p.category, sum(i.sale_price - p.cost) / sum(i.sale_price) as gm
    from thelook_ecommerce.order_items i join thelook_ecommerce.products p on i.product_id = p.id
    where i.status != 'Cancelled' and cast(i.created_at as date) between '2025-01-01' and '2025-12-31'
    group by 1 order by gm desc limit 1
- id: x10
  question: New customers by traffic source in Q3 2026
  expect: answered
  sql: |
    with firsts as (select user_id, min(created_at) as first_at from thelook_ecommerce.orders group by 1)
    select u.traffic_source, count(*) from firsts f join thelook_ecommerce.users u on f.user_id = u.id
    where cast(first_at as date) between '2026-07-01' and '2026-09-30' group by 1
- id: x11
  question: Top 3 countries by gross revenue last year
  expect: answered
  ordered: true
  sql: |
    select u.country, sum(i.sale_price) as rev
    from thelook_ecommerce.order_items i join thelook_ecommerce.users u on i.user_id = u.id
    where i.status != 'Cancelled' and cast(i.created_at as date) between '2025-01-01' and '2025-12-31'
    group by 1 order by rev desc limit 3
- id: x12
  question: Net revenue in Brazil in 2025
  expect: answered
  sql: |
    select sum(case when i.status != 'Cancelled' then i.sale_price else 0 end)
         - sum(case when i.status = 'Returned' then i.sale_price else 0 end)
    from thelook_ecommerce.order_items i join thelook_ecommerce.users u on i.user_id = u.id
    where u.country = 'Brasil' and cast(i.created_at as date) between '2025-01-01' and '2025-12-31'
