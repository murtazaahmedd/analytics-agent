name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truemetric_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRUEMETRIC_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/truemetric_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build demo warehouse and metric layer
        run: make data
      - name: Unit, integration and control-plane tests (incl. tenant isolation)
        run: make test
      - name: Eval gate (blocks merge on accuracy drop or any confidently wrong answer)
        run: make evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
