name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build demo warehouse and metric layer
        run: make data
      - name: Unit and integration tests
        run: make test
      - name: Eval gate (blocks merge on accuracy drop or any confidently wrong answer)
        run: make evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
